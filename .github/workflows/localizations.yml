name: Validate translations

on:
  push:
    branches: [localizations]
  pull_request:
    branches: [localizations]
  workflow_dispatch:

concurrency:
  group: translations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate translation catalogs and packs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Lua 5.1
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Cache translation inventory
        uses: actions/cache@v6
        with:
          path: .validation-cache/translation-source.json
          key: translation-source-v5-${{ runner.os }}-${{ github.sha }}

      - name: Validate translation packs
        shell: pwsh
        run: ./tools/Validate-TranslationPacks335.ps1 -RepoRoot . -SourceCatalog .validation-cache/translation-source.json -RequireLua