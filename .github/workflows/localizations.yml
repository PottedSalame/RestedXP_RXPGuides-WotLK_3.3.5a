name: Validate translations

on:
  push:
    branches: [localizations]
  pull_request:
    branches: [localizations]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate compiled locale artifacts and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out localization artifacts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve pinned addon test runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '\r\n[:space:]' < RUNTIME.lock)"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid RUNTIME.lock"; exit 1; }
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Check out addon libraries and packaging tools
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.runtime.outputs.revision }}
          path: .runtime
          persist-credentials: false

      - name: Install validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip unzip

      - name: Validate compiled artifacts
        shell: bash
        run: lua5.1 tools/validate-locale-artifacts.lua . .runtime

      - name: Validate companion packaging
        shell: bash
        run: |
          bash .runtime/tools/Build-LocalePackages335.sh \
            --source . --output .locale-release --version v0-ci \
            --revision "${{ github.sha }}"
