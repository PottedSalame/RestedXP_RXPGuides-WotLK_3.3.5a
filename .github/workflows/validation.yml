name: Validate 3.3.5 addon data

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Guides, quest flow, talents, and privacy
    # Match the release runner so case-sensitive path mistakes are caught on
    # ordinary pushes and pull requests instead of only after tagging.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Lua 5.1 test runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate runtime architecture and compatibility surface
        shell: pwsh
        run: ./tools/Validate-Runtime335.ps1 -RequireLua

      - name: Validate loaded guides and compatibility packs
        shell: pwsh
        run: ./tools/Validate-Guides335.ps1

      - name: Validate multilingual guide display catalogs
        shell: pwsh
        run: ./tools/Validate-GuideTranslations335.ps1

      - name: Cache deterministic translation inventory
        uses: actions/cache@v4
        with:
          path: .validation-cache/translation-source.json
          key: translation-source-v2-${{ runner.os }}-${{ hashFiles('RXPGuides.toc', '**/*.xml', 'Compat/**/*.lua', 'Core/**/*.lua', 'DB/**/*.lua', 'Features/**/*.lua', 'Guide/**/*.lua', 'Guides/**/*.lua', 'UI/**/*.lua', '*.lua', 'tools/Export-TranslationUnits335.ps1') }}

      - name: Validate deterministic translation packs
        shell: pwsh
        run: ./tools/Validate-TranslationPacks335.ps1 -SourceCatalog .validation-cache/translation-source.json -RequireLua

      - name: Validate quest flow
        shell: pwsh
        run: ./tools/Validate-QuestFlow335.ps1 -SkipQuestValidation

      - name: Validate talent guides
        shell: pwsh
        run: ./tools/Validate-Talents335.ps1

      - name: Validate roadmap module wiring and safety guards
        shell: pwsh
        run: ./tools/Validate-Roadmap335.ps1

      - name: Reject personal paths and private runtime data
        shell: pwsh
        run: ./tools/Validate-Privacy335.ps1
