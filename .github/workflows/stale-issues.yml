name: Mark and close stale issues

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stale:
    name: Process inactive issues
    runs-on: ubuntu-latest

    steps:
      - name: Mark and close inactive issues
        uses: actions/stale@v10
        with:
          days-before-issue-stale: 7
          days-before-issue-close: 7
          stale-issue-message: "This issue has been marked as stale because it has not been updated in a while."
          close-issue-message: "Closing this issue due to inactivity."
          stale-issue-label: stale
          remove-issue-stale-when-updated: true

          # This policy applies only to issues, not pull requests.
          days-before-pr-stale: -1
          days-before-pr-close: -1
